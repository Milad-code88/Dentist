<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tandläkaren</title>
    <script type="text/javascript">
      // Redirect GitHub Pages subpaths to HashRouter path
      var path = window.location.pathname;
      var repo = '/Dentist';
      if (path.startsWith(repo)) {
        var subpath = path.substring(repo.length);
        window.location.replace(repo + '/#' + subpath + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
  </body>
</html>
